<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Put events on a zoomable timeline. Add each event with a date and how much it matters, and the big ones stand out while the small ones appear as you zoom in.">
    <link rel="icon" href="data:,">
    <title>Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
        }

        body.timeline-active {
            overflow: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        body.timeline-active .container {
            max-width: 100%;
            height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 20px 0;
            flex-shrink: 0;
        }

        body.timeline-active header {
            display: none;
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #aaa;
            margin-top: 10px;
            font-size: 1.1em;
        }

        .current-list-banner {
            text-align: center;
            padding: 10px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            flex-shrink: 0;
        }

        body.timeline-active .current-list-banner {
            display: none;
        }

        .current-list-name {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
        }

        .data-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        body.timeline-active .data-controls {
            display: none;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        body.timeline-active .tabs {
            margin-bottom: 10px;
        }

        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        #timeline-tab.active {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
        }

        /* Form Styles */
        .form-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .form-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1em;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: 2px solid #667eea;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Events List */
        .events-list-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            flex: 1;
            overflow-y: auto;
        }

        .events-list-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-count {
            font-size: 0.8em;
            color: #aaa;
            font-weight: normal;
        }

        .events-list {
            list-style: none;
        }

        .event-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 4px solid;
            transition: all 0.3s;
        }

        .event-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .event-item.sig-low { border-left-color: #4caf50; }
        .event-item.sig-medium { border-left-color: #ff9800; }
        .event-item.sig-high { border-left-color: #f44336; }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .event-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
        }

        .event-actions {
            display: flex;
            gap: 8px;
        }

        .event-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .event-actions button:hover {
            opacity: 1;
        }

        .event-actions .edit-btn { color: #667eea; }
        .event-actions .delete-btn { color: #f44336; }

        .event-meta {
            display: flex;
            gap: 20px;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .event-description {
            color: #aaa;
            font-size: 0.9em;
        }

        .significance-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .significance-badge.low { background: rgba(76, 175, 80, 0.3); color: #4caf50; }
        .significance-badge.medium { background: rgba(255, 152, 0, 0.3); color: #ff9800; }
        .significance-badge.high { background: rgba(244, 67, 54, 0.3); color: #f44336; }

        /* Saves Tab */
        .saves-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .saves-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .save-list {
            list-style: none;
        }

        .save-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }

        .save-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.1);
        }

        .save-item.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .save-info h4 {
            color: #fff;
            margin-bottom: 5px;
        }

        .save-info p {
            color: #888;
            font-size: 0.85em;
        }

        .save-actions {
            display: flex;
            gap: 10px;
        }

        /* Timeline Tab */
        .timeline-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 0;
        }

        body.timeline-active .timeline-container {
            border-radius: 10px;
        }

        .timeline-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .timeline-controls button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .timeline-controls button:hover {
            background: rgba(255,255,255,0.2);
        }

        .timeline-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            color: #aaa;
            z-index: 100;
            max-width: calc(100% - 185px); /* stay clear of the zoom buttons on narrow screens */
        }

        .timeline-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        .timeline-canvas:active {
            cursor: grabbing;
        }

        .timeline-canvas.dragging {
            cursor: grabbing;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal h3 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            transform: translateX(150%);
            transition: transform 0.3s;
            z-index: 3000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, #4caf50, #45a049);
        }

        .notification.error {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }

        .notification.info {
            background: linear-gradient(135deg, #2196f3, #1976d2);
        }

        .no-events-message {
            text-align: center;
            padding: 50px;
            color: #aaa;
        }

        .no-events-message h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #667eea;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .tab-btn {
                padding: 10px 15px;
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Timeline</h1>
            <p>Visualize your events across time</p>
        </header>

        <div class="current-list-banner" id="current-list-banner">
            <span>Current Timeline: </span>
            <span class="current-list-name" id="current-list-name">No timeline selected</span>
        </div>

        <div class="data-controls">
            <button class="btn btn-success" onclick="updateCurrentList()">Update Timeline</button>
        </div>

        <div class="tabs">
            <button class="tab-btn" onclick="switchTab('saves')">Saves</button>
            <button class="tab-btn active" onclick="switchTab('events')">Events</button>
            <button class="tab-btn" onclick="switchTab('timeline')">Timeline</button>
        </div>

        <!-- Saves Tab -->
        <div id="saves-tab" class="tab-content">
            <div class="saves-section">
                <h2>Create New Timeline</h2>
                <div class="form-group">
                    <label for="new-list-name">Timeline Name</label>
                    <input type="text" id="new-list-name" placeholder="e.g., 'World History' or 'My Life'"
                           onkeypress="if(event.key==='Enter')createNewList()">
                </div>
                <button class="btn btn-primary" onclick="createNewList()">Create Timeline</button>
            </div>

            <div class="saves-section">
                <h2>Your Timelines</h2>
                <ul class="save-list" id="save-list">
                    <!-- Saves will be rendered here -->
                </ul>
            </div>
        </div>

        <!-- Events Tab -->
        <div id="events-tab" class="tab-content active">
            <div class="form-section">
                <h2 id="event-form-title">Add New Event</h2>
                <div class="form-group">
                    <label for="event-name">Event Name *</label>
                    <input type="text" id="event-name" placeholder="e.g., 'First Moon Landing'">
                </div>
                <div class="form-group">
                    <label for="event-description">Description (optional)</label>
                    <textarea id="event-description" placeholder="Add details about this event..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="event-date">Date *</label>
                        <input type="date" id="event-date">
                    </div>
                    <div class="form-group">
                        <label for="event-significance">Significance (1-20)</label>
                        <input type="number" id="event-significance" min="1" max="20" value="10" placeholder="1-20">
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="event-submit-btn" onclick="addOrUpdateEvent()">Add Event</button>
                    <button class="btn btn-secondary" id="event-cancel-btn" onclick="cancelEdit()" style="display: none;">Cancel</button>
                </div>
            </div>

            <div class="events-list-section">
                <h2>
                    Events
                    <span class="event-count" id="event-count">0 events</span>
                </h2>
                <ul class="events-list" id="events-list">
                    <!-- Events will be rendered here -->
                </ul>
            </div>
        </div>

        <!-- Timeline Tab -->
        <div id="timeline-tab" class="tab-content">
            <div class="timeline-container" id="timeline-container">
                <div class="timeline-info" id="timeline-info">
                    <div>Scroll to zoom • Right-click drag to pan • Edge scroll enabled</div>
                    <div id="zoom-level">Zoom: 100%</div>
                </div>
                <div class="timeline-controls">
                    <button onclick="zoomIn()" title="Zoom In">+</button>
                    <button onclick="zoomOut()" title="Zoom Out">−</button>
                    <button onclick="resetView()" title="Reset View">⟲</button>
                </div>
                <canvas id="timeline-canvas" class="timeline-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h3 id="modal-title">Edit</h3>
            <div class="form-group">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveListEdit()">Save</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal (replaces the browser's confirm()) -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
            <h3 id="confirm-message"></h3>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="confirm-cancel">Cancel</button>
                <button class="btn btn-primary" id="confirm-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script>
        // ===== DATA STRUCTURES =====

        let allLists = {};
        let currentListId = null;
        let currentList = {
            name: '',
            events: []
        };

        // Edit state
        let editingEventId = null;
        let editingListId = null;

        // Timeline state
        let timelineState = {
            zoom: 1,
            offsetX: 0,
            offsetY: 0,
            isDragging: false,
            dragStartX: 0,
            dragStartY: 0,
            lastOffsetX: 0,
            lastOffsetY: 0
        };

        let canvas, ctx;
        let animationFrame;
        let edgeScrollInterval = null;
        let edgeScrollVec = { x: 0, y: 0 };

        // ===== INITIALIZATION =====

        function init() {
            loadAllData();
            setupCanvas();
            setupEventListeners();
            renderAll();
        }

        function setupCanvas() {
            canvas = document.getElementById('timeline-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            const container = document.getElementById('timeline-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            renderTimeline();
        }

        function setupEventListeners() {
            // Mouse wheel zoom
            canvas.addEventListener('wheel', handleWheel, { passive: false });

            // Right-click drag
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseLeave);
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // Edge scroll detection
            document.addEventListener('mousemove', handleEdgeScroll);
        }

        // ===== TIMELINE RENDERING =====

        function renderTimeline() {
            if (!canvas || !ctx) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const events = currentList.events || [];
            if (events.length === 0) {
                drawEmptyTimeline();
                return;
            }

            // Sort events by date
            const sortedEvents = [...events].sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));

            // Calculate time range
            const minDate = parseLocalDate(sortedEvents[0].date);
            const maxDate = parseLocalDate(sortedEvents[sortedEvents.length - 1].date);
            const timeRange = maxDate - minDate || 86400000; // At least 1 day

            // Calculate visible events based on zoom level
            const visibleEvents = getVisibleEvents(sortedEvents);

            // Draw timeline
            drawTimelineLine();
            drawTimeMarkers(minDate, maxDate, timeRange);
            drawEvents(visibleEvents, minDate, timeRange);

            // Update zoom display
            document.getElementById('zoom-level').textContent = `Zoom: ${Math.round(timelineState.zoom * 100)}%`;
        }

        function drawEmptyTimeline() {
            ctx.fillStyle = '#666';
            ctx.font = '18px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('No events to display', canvas.width / 2, canvas.height / 2);
            ctx.font = '14px Segoe UI';
            ctx.fillText('Add events in the Events tab', canvas.width / 2, canvas.height / 2 + 30);
        }

        function drawTimelineLine() {
            const y = canvas.height / 2 + timelineState.offsetY;

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.5)';
            ctx.lineWidth = 3;
            ctx.moveTo(50, y);
            ctx.lineTo(canvas.width - 50, y);
            ctx.stroke();

            // Draw arrow at end
            ctx.beginPath();
            ctx.fillStyle = 'rgba(102, 126, 234, 0.5)';
            ctx.moveTo(canvas.width - 50, y);
            ctx.lineTo(canvas.width - 60, y - 8);
            ctx.lineTo(canvas.width - 60, y + 8);
            ctx.closePath();
            ctx.fill();
        }

        function drawTimeMarkers(minDate, maxDate, timeRange) {
            const y = canvas.height / 2 + timelineState.offsetY;
            const padding = 100;
            const availableWidth = (canvas.width - padding * 2) * timelineState.zoom;

            const dayMs = 86400000;
            const pixelsPerDay = availableWidth / (timeRange / dayMs);

            // Target: markers should be roughly 80-150 pixels apart
            const targetSpacing = 100;

            ctx.textAlign = 'center';

            // Helper to get x position for a date
            const getX = (date) => {
                const progress = (date - minDate) / timeRange;
                return padding + progress * availableWidth + timelineState.offsetX;
            };

            // Determine which scale to use based on pixels per day
            // We want markers ~100px apart
            // Days: if pixelsPerDay > 50, show days
            // Months: if pixelsPerDay * 30 > 50 (i.e., pixelsPerDay > 1.7), show months
            // Years: if pixelsPerDay * 365 > 50 (i.e., pixelsPerDay > 0.14), show years

            if (pixelsPerDay > 50) {
                // Show DAYS only
                drawDayMarkers(minDate, maxDate, getX, y, pixelsPerDay);
            } else if (pixelsPerDay > 1.5) {
                // Show MONTHS only
                drawMonthMarkers(minDate, maxDate, getX, y, pixelsPerDay);
            } else {
                // Show YEARS only
                drawYearMarkers(minDate, maxDate, getX, y, pixelsPerDay);
            }
        }

        function drawYearMarkers(minDate, maxDate, getX, y, pixelsPerDay) {
            const pixelsPerYear = pixelsPerDay * 365;

            // Calculate year step to keep markers ~100px apart
            let yearStep = 1;
            if (pixelsPerYear < 50) yearStep = 2;
            if (pixelsPerYear < 25) yearStep = 5;
            if (pixelsPerYear < 10) yearStep = 10;
            if (pixelsPerYear < 5) yearStep = 20;
            if (pixelsPerYear < 2.5) yearStep = 50;
            if (pixelsPerYear < 1) yearStep = 100;

            const startYear = Math.floor(minDate.getFullYear() / yearStep) * yearStep;
            const endYear = maxDate.getFullYear() + yearStep;

            for (let year = startYear; year <= endYear; year += yearStep) {
                const yearDate = localDate(year, 0, 1);
                const x = getX(yearDate);

                if (x >= -50 && x <= canvas.width + 50) {
                    // Year line
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(102, 126, 234, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.moveTo(x, y - 15);
                    ctx.lineTo(x, y + 15);
                    ctx.stroke();

                    // Year label
                    ctx.fillStyle = '#667eea';
                    ctx.font = 'bold 13px Segoe UI';
                    ctx.fillText(year.toString(), x, y + 35);
                }
            }
        }

        function drawMonthMarkers(minDate, maxDate, getX, y, pixelsPerDay) {
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const pixelsPerMonth = pixelsPerDay * 30;

            // Calculate month step to keep markers ~100px apart
            let monthStep = 1;
            if (pixelsPerMonth < 50) monthStep = 2;
            if (pixelsPerMonth < 25) monthStep = 3;
            if (pixelsPerMonth < 15) monthStep = 6;

            const startYear = minDate.getFullYear();
            const endYear = maxDate.getFullYear() + 1;

            for (let year = startYear; year <= endYear; year++) {
                for (let month = 0; month < 12; month += monthStep) {
                    const monthDate = localDate(year, month, 1);
                    const x = getX(monthDate);

                    if (x >= -50 && x <= canvas.width + 50) {
                        const isJanuary = month === 0;

                        // Draw line
                        ctx.beginPath();
                        ctx.strokeStyle = isJanuary ? 'rgba(102, 126, 234, 0.6)' : 'rgba(255, 255, 255, 0.3)';
                        ctx.lineWidth = isJanuary ? 2 : 1;
                        ctx.moveTo(x, y - (isJanuary ? 15 : 10));
                        ctx.lineTo(x, y + (isJanuary ? 15 : 10));
                        ctx.stroke();

                        // Draw label
                        if (isJanuary) {
                            ctx.fillStyle = '#667eea';
                            ctx.font = 'bold 12px Segoe UI';
                            ctx.fillText(year.toString(), x, y + 35);
                        } else {
                            ctx.fillStyle = '#888';
                            ctx.font = '11px Segoe UI';
                            ctx.fillText(monthNames[month], x, y + 28);
                        }
                    }
                }
            }
        }

        function drawDayMarkers(minDate, maxDate, getX, y, pixelsPerDay) {
            const dayMs = 86400000;

            // Calculate day step to keep markers ~100px apart
            let dayStep = 1;
            if (pixelsPerDay < 100) dayStep = 2;
            if (pixelsPerDay < 50) dayStep = 5;
            if (pixelsPerDay < 25) dayStep = 7;

            let currentDate = new Date(minDate);
            currentDate.setHours(0, 0, 0, 0);

            // Align to day step
            const dayOfMonth = currentDate.getDate();
            const alignedDay = Math.floor((dayOfMonth - 1) / dayStep) * dayStep + 1;
            currentDate.setDate(alignedDay);

            while (currentDate <= new Date(maxDate.getTime() + dayMs * 30)) {
                const x = getX(currentDate);

                if (x >= -50 && x <= canvas.width + 50) {
                    const day = currentDate.getDate();
                    const month = currentDate.getMonth();
                    const isFirstOfMonth = day === 1;

                    // Draw line
                    ctx.beginPath();
                    ctx.strokeStyle = isFirstOfMonth ? 'rgba(102, 126, 234, 0.6)' : 'rgba(255, 255, 255, 0.25)';
                    ctx.lineWidth = isFirstOfMonth ? 2 : 1;
                    ctx.moveTo(x, y - (isFirstOfMonth ? 15 : 8));
                    ctx.lineTo(x, y + (isFirstOfMonth ? 15 : 8));
                    ctx.stroke();

                    // Draw label
                    if (isFirstOfMonth) {
                        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        ctx.fillStyle = '#667eea';
                        ctx.font = 'bold 11px Segoe UI';
                        ctx.fillText(monthNames[month] + ' ' + currentDate.getFullYear(), x, y + 32);
                    } else {
                        ctx.fillStyle = '#888';
                        ctx.font = '10px Segoe UI';
                        ctx.fillText(day.toString(), x, y + 24);
                    }
                }

                // Step by calendar days (adding 24h drifts an hour at daylight-saving changes)
                // and restart at the 1st of each month so month labels are never skipped.
                const nextDate = new Date(currentDate);
                nextDate.setDate(nextDate.getDate() + dayStep);
                if (nextDate.getMonth() !== currentDate.getMonth()) nextDate.setDate(1);
                currentDate = nextDate;
            }
        }

        function getVisibleEvents(sortedEvents) {
            // Calculate available space and filter events based on significance
            const minSignificanceForZoom = Math.max(1, Math.floor(21 - timelineState.zoom * 20));

            // Filter by significance threshold
            let filtered = sortedEvents.filter(e => e.significance >= minSignificanceForZoom);

            // Additional collision detection - hide lower significance events if too crowded
            const padding = 100;
            const availableWidth = (canvas.width - padding * 2) * timelineState.zoom;

            if (filtered.length === 0) return sortedEvents.slice(0, 1); // Always show at least one

            const minDate = parseLocalDate(sortedEvents[0].date);
            const maxDate = parseLocalDate(sortedEvents[sortedEvents.length - 1].date);
            const timeRange = maxDate - minDate || 86400000;

            // Calculate positions and check for overlaps
            const eventPositions = filtered.map(e => {
                const progress = (parseLocalDate(e.date) - minDate) / timeRange;
                const x = padding + progress * availableWidth + timelineState.offsetX;
                const size = 10 + (e.significance / 20) * 30;
                return { event: e, x, size };
            });
            // Place the most significant events first so they win any overlap
            // (stable sort: equal significance keeps date order)
            eventPositions.sort((a, b) => b.event.significance - a.event.significance);

            // Remove overlapping events (keep higher significance)
            const visible = [];
            for (const ep of eventPositions) {
                let overlaps = false;
                for (const vp of visible) {
                    const distance = Math.abs(ep.x - vp.x);
                    const minDistance = (ep.size + vp.size) / 2 + 20;
                    if (distance < minDistance) {
                        overlaps = true;
                        break;
                    }
                }
                if (!overlaps) {
                    visible.push(ep);
                }
            }

            // Back to date order (drawEvents alternates above/below by this order)
            return visible.map(v => v.event).sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));
        }

        function drawEvents(events, minDate, timeRange) {
            const padding = 100;
            const availableWidth = (canvas.width - padding * 2) * timelineState.zoom;
            const centerY = canvas.height / 2 + timelineState.offsetY;

            const sortedEvents = [...currentList.events].sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));
            const fullMinDate = sortedEvents.length > 0 ? parseLocalDate(sortedEvents[0].date) : minDate;
            const fullMaxDate = sortedEvents.length > 0 ? parseLocalDate(sortedEvents[sortedEvents.length - 1].date) : minDate;
            const fullTimeRange = fullMaxDate - fullMinDate || 86400000;

            events.forEach((event, index) => {
                const progress = (parseLocalDate(event.date) - fullMinDate) / fullTimeRange;
                const x = padding + progress * availableWidth + timelineState.offsetX;

                // Skip if outside visible area
                if (x < -50 || x > canvas.width + 50) return;

                // Size based on significance (10-40px)
                const size = 10 + (event.significance / 20) * 30;

                // Alternate above/below timeline
                const above = index % 2 === 0;
                const yOffset = above ? -60 - size/2 : 60 + size/2;
                const y = centerY + yOffset;

                // Draw connector line
                ctx.beginPath();
                ctx.strokeStyle = getSignificanceColor(event.significance, 0.5);
                ctx.lineWidth = 2;
                ctx.moveTo(x, centerY);
                ctx.lineTo(x, y + (above ? size/2 : -size/2));
                ctx.stroke();

                // Draw event circle
                ctx.beginPath();
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, size/2);
                gradient.addColorStop(0, getSignificanceColor(event.significance, 1));
                gradient.addColorStop(1, getSignificanceColor(event.significance, 0.3));
                ctx.fillStyle = gradient;
                ctx.arc(x, y, size/2, 0, Math.PI * 2);
                ctx.fill();

                // Draw border
                ctx.beginPath();
                ctx.strokeStyle = getSignificanceColor(event.significance, 0.8);
                ctx.lineWidth = 2;
                ctx.arc(x, y, size/2, 0, Math.PI * 2);
                ctx.stroke();

                // Draw label
                ctx.fillStyle = '#fff';
                ctx.font = `${Math.max(11, Math.min(14, size/3))}px Segoe UI`;
                ctx.textAlign = 'center';

                const labelY = above ? y - size/2 - 8 : y + size/2 + 16;
                ctx.fillText(truncateText(event.name, 20), x, labelY);

                // Draw date below label
                ctx.fillStyle = '#888';
                ctx.font = '10px Segoe UI';
                const dateY = above ? labelY - 14 : labelY + 12;
                ctx.fillText(formatDateShort(event.date), x, dateY);
            });
        }

        function getSignificanceColor(significance, alpha) {
            if (significance <= 7) {
                return `rgba(76, 175, 80, ${alpha})`; // Green
            } else if (significance <= 14) {
                return `rgba(255, 152, 0, ${alpha})`; // Orange
            } else {
                return `rgba(244, 67, 54, ${alpha})`; // Red
            }
        }

        function truncateText(text, maxLength) {
            return text.length > maxLength ? text.substring(0, maxLength - 2) + '...' : text;
        }

        // Local midnight for a year/month/day. setFullYear is needed because
        // new Date(79, 7, 24) means 1979, not the year 79.
        function localDate(year, month, day) {
            const d = new Date(2000, 0, 1);
            d.setFullYear(year, month, day);
            return d;
        }

        // Parse "YYYY-MM-DD" as a local date (new Date("YYYY-MM-DD") is UTC midnight,
        // which shows as the previous day in US time zones).
        function parseLocalDate(dateStr) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
            return m ? localDate(+m[1], +m[2] - 1, +m[3]) : new Date(dateStr);
        }

        function formatDateShort(dateStr) {
            const date = parseLocalDate(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // ===== TIMELINE INTERACTION =====

        function handleWheel(e) {
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;

            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const newZoom = Math.max(0.1, Math.min(10000, timelineState.zoom * zoomFactor));

            // Zoom towards mouse position (x = padding + p * width * zoom + offsetX, padding 100)
            const padding = 100;
            const zoomPoint = (mouseX - padding - timelineState.offsetX) / timelineState.zoom;
            timelineState.offsetX = mouseX - padding - zoomPoint * newZoom;

            timelineState.zoom = newZoom;
            renderTimeline();
        }

        function handleMouseDown(e) {
            if (e.button === 2) { // Right click
                timelineState.isDragging = true;
                timelineState.dragStartX = e.clientX;
                timelineState.dragStartY = e.clientY;
                timelineState.lastOffsetX = timelineState.offsetX;
                timelineState.lastOffsetY = timelineState.offsetY;
                canvas.classList.add('dragging');
            }
        }

        function handleMouseMove(e) {
            if (timelineState.isDragging) {
                const deltaX = e.clientX - timelineState.dragStartX;
                const deltaY = e.clientY - timelineState.dragStartY;
                timelineState.offsetX = timelineState.lastOffsetX + deltaX;
                timelineState.offsetY = timelineState.lastOffsetY + deltaY;
                renderTimeline();
            }
        }

        function handleMouseUp(e) {
            if (e.button === 2) {
                timelineState.isDragging = false;
                canvas.classList.remove('dragging');
            }
        }

        function handleMouseLeave() {
            timelineState.isDragging = false;
            canvas.classList.remove('dragging');
            // Leaving the window from an edge sends no further mousemove: stop edge scroll here
            if (edgeScrollInterval) {
                clearInterval(edgeScrollInterval);
                edgeScrollInterval = null;
            }
        }

        function handleEdgeScroll(e) {
            const container = document.getElementById('timeline-container');
            const rect = container.getBoundingClientRect();
            const edgeThreshold = 50;
            const scrollSpeed = 5;

            // Check if mouse is in timeline tab and near edge
            if (!document.getElementById('timeline-tab').classList.contains('active')) {
                if (edgeScrollInterval) {
                    clearInterval(edgeScrollInterval);
                    edgeScrollInterval = null;
                }
                return;
            }

            // Only over the canvas itself, so hovering the zoom buttons or info box doesn't pan
            const inContainer = e.target === canvas &&
                               e.clientX >= rect.left && e.clientX <= rect.right &&
                               e.clientY >= rect.top && e.clientY <= rect.bottom;

            if (!inContainer) {
                if (edgeScrollInterval) {
                    clearInterval(edgeScrollInterval);
                    edgeScrollInterval = null;
                }
                return;
            }

            let scrollX = 0;
            let scrollY = 0;

            if (e.clientX - rect.left < edgeThreshold) {
                scrollX = scrollSpeed;
            } else if (rect.right - e.clientX < edgeThreshold) {
                scrollX = -scrollSpeed;
            }

            if (e.clientY - rect.top < edgeThreshold) {
                scrollY = scrollSpeed;
            } else if (rect.bottom - e.clientY < edgeThreshold) {
                scrollY = -scrollSpeed;
            }

            edgeScrollVec = { x: scrollX, y: scrollY };

            if (scrollX !== 0 || scrollY !== 0) {
                if (!edgeScrollInterval) {
                    edgeScrollInterval = setInterval(() => {
                        timelineState.offsetX += edgeScrollVec.x;
                        timelineState.offsetY += edgeScrollVec.y;
                        renderTimeline();
                    }, 16);
                }
            } else {
                if (edgeScrollInterval) {
                    clearInterval(edgeScrollInterval);
                    edgeScrollInterval = null;
                }
            }
        }

        function zoomIn() {
            timelineState.zoom = Math.min(10000, timelineState.zoom * 1.2);
            renderTimeline();
        }

        function zoomOut() {
            timelineState.zoom = Math.max(0.1, timelineState.zoom / 1.2);
            renderTimeline();
        }

        function resetView() {
            timelineState.zoom = 1;
            timelineState.offsetX = 0;
            timelineState.offsetY = 0;
            renderTimeline();
        }

        // ===== EVENT MANAGEMENT =====

        function addOrUpdateEvent() {
            if (!currentListId) {
                showNotification('Please select or create a timeline first', 'error');
                switchTab('saves');
                return;
            }

            const name = document.getElementById('event-name').value.trim();
            const description = document.getElementById('event-description').value.trim();
            const date = document.getElementById('event-date').value;
            const significance = parseInt(document.getElementById('event-significance').value) || 10;

            if (!name) {
                showNotification('Please enter an event name', 'error');
                return;
            }

            if (!date) {
                showNotification('Please enter a date', 'error');
                return;
            }

            if (significance < 1 || significance > 20) {
                showNotification('Significance must be between 1 and 20', 'error');
                return;
            }

            if (editingEventId) {
                // Update existing event
                const event = currentList.events.find(e => e.id === editingEventId);
                if (event) {
                    event.name = name;
                    event.description = description;
                    event.date = date;
                    event.significance = significance;
                    showNotification('Event updated!', 'success');
                }
                cancelEdit();
            } else {
                // Add new event
                const newEvent = {
                    id: Date.now().toString(),
                    name,
                    description,
                    date,
                    significance,
                    createdAt: Date.now()
                };
                currentList.events.push(newEvent);
                showNotification(`"${name}" added!`, 'success');
            }

            clearEventForm();

            // Sync currentList back to allLists
            if (currentListId) {
                allLists[currentListId] = currentList;
            }

            saveAllData();
            renderAll();
        }

        function editEvent(eventId) {
            const event = currentList.events.find(e => e.id === eventId);
            if (!event) return;

            editingEventId = eventId;

            document.getElementById('event-name').value = event.name;
            document.getElementById('event-description').value = event.description || '';
            document.getElementById('event-date').value = event.date;
            document.getElementById('event-significance').value = event.significance;

            document.getElementById('event-form-title').textContent = 'Edit Event';
            document.getElementById('event-submit-btn').textContent = 'Update Event';
            document.getElementById('event-cancel-btn').style.display = 'inline-block';

            // Scroll to form
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            editingEventId = null;
            clearEventForm();
            document.getElementById('event-form-title').textContent = 'Add New Event';
            document.getElementById('event-submit-btn').textContent = 'Add Event';
            document.getElementById('event-cancel-btn').style.display = 'none';
        }

        function clearEventForm() {
            document.getElementById('event-name').value = '';
            document.getElementById('event-description').value = '';
            document.getElementById('event-date').value = '';
            document.getElementById('event-significance').value = '10';
        }

        function deleteEvent(eventId) {
            const event = currentList.events.find(e => e.id === eventId);
            if (!event) return;

            appConfirm(`Delete "${event.name}"?`).then(ok => {
                if (ok) removeEvent(eventId, event.name);
            });
        }

        function removeEvent(eventId, eventName) {
            currentList.events = currentList.events.filter(e => e.id !== eventId);

            // Sync currentList back to allLists
            if (currentListId) {
                allLists[currentListId] = currentList;
            }

            saveAllData();
            renderAll();
            showNotification(`"${eventName}" deleted`, 'info');
        }

        // ===== RENDERING =====

        function renderAll() {
            renderSaves();
            renderEvents();
            renderTimeline();
            updateCurrentListBanner();
        }

        function updateCurrentListBanner() {
            const nameEl = document.getElementById('current-list-name');
            if (currentListId && currentList.name) {
                nameEl.textContent = currentList.name;
            } else {
                nameEl.textContent = 'No timeline selected';
            }
        }

        function renderSaves() {
            const list = document.getElementById('save-list');
            const listIds = Object.keys(allLists);

            if (listIds.length === 0) {
                list.innerHTML = `
                    <li class="no-events-message">
                        <h3>No timelines yet!</h3>
                        <p>Create a new timeline above to get started.</p>
                    </li>
                `;
                return;
            }

            list.innerHTML = listIds.map(id => {
                const savedList = allLists[id];
                const isActive = id === currentListId;
                const eventCount = savedList.events ? savedList.events.length : 0;

                return `
                    <li class="save-item ${isActive ? 'active' : ''}" onclick="loadList('${id}')">
                        <div class="save-info">

                        </div>
                        <div class="save-actions">
                            ${isActive ? '<span style="color: #4caf50;">✓ Active</span>' : '<button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); loadList(\'' + id + '\')">Load</button>'}
                            <button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); openEditList('${id}')" aria-label="Rename timeline" style="padding: 8px 12px;">✎</button>
                            <button class="btn btn-small btn-danger" onclick="event.stopPropagation(); deleteList('${id}')" aria-label="Delete timeline" style="padding: 8px 12px;">✕</button>

            }).join('');

        function renderEvents() {
            const list = document.getElementById('events-list');
            const count = document.getElementById('event-count');

            count.textContent = `${currentList.events.length} event${currentList.events.length !== 1 ? 's' : ''}`;

            if (currentList.events.length === 0) {
                list.innerHTML = `
                    <li class="no-events-message">
                        <h3>No events yet!</h3>
                        <p>${currentListId ? 'Add some events above to populate your timeline.' : 'Select or create a timeline first in the Saves tab.'}</p>
                    </li>
                `;
                return;
            }

            // Sort by date
            const sorted = [...currentList.events].sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));

            list.innerHTML = sorted.map(event => {
                const sigClass = event.significance <= 7 ? 'low' : event.significance <= 14 ? 'medium' : 'high';
                const sigBadgeClass = event.significance <= 7 ? 'low' : event.significance <= 14 ? 'medium' : 'high';

                return `
                    <li class="event-item sig-${sigClass}">
                        <div class="event-header">
                            <span class="event-name">${escapeHtml(event.name)}</span>
                            <div class="event-actions">
                                <button class="edit-btn" onclick="editEvent('${event.id}')" title="Edit">✎</button>
                                <button class="delete-btn" onclick="deleteEvent('${event.id}')" title="Delete">✕</button>
                            </div>
                        </div>
                        <div class="event-meta">
                            <span>📅 ${formatDate(event.date)}</span>
                            <span class="significance-badge ${sigBadgeClass}">Significance: ${event.significance}</span>
                        </div>
                        ${event.description ? `<div class="event-description">${escapeHtml(event.description)}</div>` : ''}
                    </li>
                `;
            }).join('');
        }

        // ===== LIST MANAGEMENT =====

        function createNewList() {
            const nameInput = document.getElementById('new-list-name');
            const name = nameInput.value.trim();

            if (!name) {
                showNotification('Please enter a timeline name', 'error');
                return;
            }

            const listId = Date.now().toString();
            const newList = {
                name,
                events: [],
                createdAt: Date.now()
            };

            allLists[listId] = newList;
            currentListId = listId;
            currentList = newList;

            nameInput.value = '';

            saveAllData();
            renderAll();
            showNotification(`Timeline "${name}" created!`, 'success');
            switchTab('events');
        }

        function loadList(listId) {
            if (!allLists[listId]) return;

            currentListId = listId;
            currentList = allLists[listId];

            if (!currentList.events) currentList.events = [];

            saveAllData();
            renderAll();
            resetView();
            showNotification(`Loaded "${currentList.name}"`, 'success');
        }

        function deleteList(listId) {
            if (!allLists[listId]) return;

            const listName = allLists[listId].name;
            appConfirm(`Delete timeline "${listName}"? All events will be lost.`).then(ok => {
                if (ok) removeList(listId, listName);
            });
        }

        function removeList(listId, listName) {
            if (!allLists[listId]) return;
            delete allLists[listId];

            if (currentListId === listId) {
                currentListId = null;
                currentList = { name: '', events: [] };
            }

            saveAllData();
            renderAll();
            showNotification(`Timeline "${listName}" deleted`, 'info');
        }

        function openEditList(listId) {
            const list = allLists[listId];
            if (!list) return;

            editingListId = listId;
            document.getElementById('modal-title').textContent = 'Edit Timeline Name';
            document.getElementById('edit-name').value = list.name;
            document.getElementById('edit-modal').classList.add('show');
        }

        // In-page replacement for confirm(): resolves true on OK/Enter, false on Cancel/Escape/backdrop.
        function appConfirm(message) {
            const overlay = document.getElementById('confirm-modal');
            const okBtn = document.getElementById('confirm-ok');
            const cancelBtn = document.getElementById('confirm-cancel');
            document.getElementById('confirm-message').textContent = message;
            const previousFocus = document.activeElement;
            return new Promise(resolve => {
                function finish(result) {
                    overlay.classList.remove('show');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                    overlay.removeEventListener('click', onBackdrop);
                    document.removeEventListener('keydown', onKey, true);
                    if (previousFocus && previousFocus.focus) previousFocus.focus();
                    resolve(result);
                }
                function onOk() { finish(true); }
                function onCancel() { finish(false); }
                function onBackdrop(e) { if (e.target === overlay) finish(false); }
                function onKey(e) {
                    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
                    else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); finish(document.activeElement !== cancelBtn); }
                }
                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
                overlay.addEventListener('click', onBackdrop);
                document.addEventListener('keydown', onKey, true);
                overlay.classList.add('show');
                okBtn.focus();
            });
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
            editingListId = null;
        }

        function saveListEdit() {
            const newName = document.getElementById('edit-name').value.trim();

            if (!newName) {
                showNotification('Name cannot be empty', 'error');
                return;
            }

            if (editingListId && allLists[editingListId]) {
                const oldName = allLists[editingListId].name;
                allLists[editingListId].name = newName;

                if (editingListId === currentListId) {
                    currentList.name = newName;
                }

                saveAllData();
                renderAll();
                showNotification(`Timeline "${oldName}" renamed to "${newName}"`, 'success');
            }

            closeEditModal();
        }

        function updateCurrentList() {
            if (!currentListId) {
                showNotification('No timeline selected to update', 'error');
                return;
            }

            allLists[currentListId] = currentList;
            saveAllData();
            showNotification(`"${currentList.name}" updated!`, 'success');
        }

        // ===== UTILITY FUNCTIONS =====

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // Toggle body class for timeline tab (needs fixed height and no scroll)
            if (tabName === 'timeline') {
                document.body.classList.add('timeline-active');
                setTimeout(() => {
                    resizeCanvas();
                    renderTimeline();
                }, 100);
            } else {
                document.body.classList.remove('timeline-active');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const date = parseLocalDate(dateStr);
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // ===== DATA PERSISTENCE =====

        function saveAllData() {
            const data = {
                allLists,
                currentListId
            };
            localStorage.setItem('timelineAppData', JSON.stringify(data));
        }

        function loadAllData() {
            const saved = localStorage.getItem('timelineAppData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    allLists = data.allLists || {};
                    currentListId = data.currentListId;
                    if (currentListId && allLists[currentListId]) {
                        currentList = allLists[currentListId];
                        if (!currentList.events) currentList.events = [];
                    }
                } catch (e) {
                    console.error('Failed to load saved data');
                }
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
